# NXP Robotics SDK - plain Zephyr stack - mr-vmu-rt1176 platform (RT1176)
#
# Builds the out-of-tree esc_passthrough application (AM32/BLHeli ESC
# configurator passthrough) for the MR-VMU-RT1176 board on generic Zephyr.
# The app source lives in robotics-apps; the FlexIO-UART transport is
# carried app-privately (no shared driver module).
#
manifest:
  version: "1.0"

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos
    - name: nxp
      url-base: https://github.com/nxp-robotics

  projects:
    - name: zephyr
      remote: zephyr
      revision: f2b5ecd866f0a4b3ce91e3cdbc89b51bf93c53c0
      path: zephyr
      import: true

    - name: robotics-apps
      remote: nxp
      revision: 26b0a8d971aa73f3a2463e3ed9888fa143d6aa0f
      path: robotics-apps
