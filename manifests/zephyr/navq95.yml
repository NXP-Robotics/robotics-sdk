# NXP Robotics SDK - Zephyr stack - navq95 platform (MR-NavQ95B, i.MX95 M7)
#
# NavQ95 (board target mr_navq95b/mimx9596/m7) is currently supported only on
# Zephyr 'main' (targeting the 4.4 release), not yet in a tagged stable release.
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyr
      # NavQ95 (mr_navq95b) lives on Zephyr 'main' for now.
      # TODO: pin to the exact SHA validated for this SDK release.
      revision: 5c12262de735358850365ede6d6f17c2db175131
      path: zephyr
      import: true
