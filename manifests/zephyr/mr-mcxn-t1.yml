# NXP Robotics SDK - Zephyr stack - mr-mcxn-t1 platform (MCXN947 MR-MCXN-T1)
#
# Board/peripheral validation via stock Zephyr samples. Brings in ONLY the
# NXP Zephyr fork (zephyr-rtos). NO zros/synapse: the cerebri apps build on the
# cerebri stack, not here. URLs are the official GitHub URLs; internal
# developers get the internal Bitbucket mirror transparently via bifrost.
manifest:
  version: "1.0"

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: nxp
      url-base: https://github.com/nxp-robotics

  projects:
    - name: zephyr-rtos
      remote: nxp
      revision: 854444617367b2e155953f90922cc8ca2359f0f0
      path: zephyr
      import: true
