# NXP Robotics SDK - Cerebri (CogniPilot) stack - vmu-rt1176 platform (RT1176 VMU)
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: cognipilot
      url-base: https://github.com/CogniPilot

  projects:
    - name: cerebri
      remote: cognipilot
      # TODO: pin to the exact SHA/tag validated for this SDK release.
      revision: main
      path: cerebri
      import: true
