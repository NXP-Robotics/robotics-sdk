# NXP Robotics SDK - Cerebri (CogniPilot) stack - navq95_m7 platform (i.MX95 M7)
#
# Cerebri drives Zephyr: importing cerebri's manifest resolves Zephyr and all
# transitive modules at cerebri's pinned revision. Built natively via `west build`
# (dispatched by `west sdk build`, see scripts/sdk.py).
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: cognipilot
      url-base: https://github.com/CogniPilot

  projects:
    - name: cerebri
      remote: cognipilot
      # TODO: pin to the exact SHA/tag validated for this SDK release.
      revision: main
      path: cerebri
      import: true
