# NXP Robotics SDK - PX4 stack - navq95 platform (NavQ95, i.MX95 M7)
#
# NavQ95 PX4 support lives on NXP's public PX4 fork
# (NXP-Robotics/PX4-Autopilot) as the `imx95` board. This manifest pins the
# exact fork remote + revision validated for this SDK release.
#
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: nxp-robotics
      url-base: ssh://git@bitbucket.sw.nxp.com/tars

  projects:
    - name: PX4-Autopilot
      remote: nxp-robotics
      repo-path: px4-autopilot-nxp.git
      # Pinned to the validated NavQ95 (imx95) commit on branch
      # pr-nuttx-12-12-0-imx95.
      revision: 36c6c23a7e982dd7019cf98a028df1b227bb5e8d
      submodules: true
      path: PX4-Autopilot
