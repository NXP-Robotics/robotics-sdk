# NXP Robotics SDK - PX4 stack - navq95 platform (NavQ95, i.MX95 M7)
#
# NavQ95 PX4 support lives on NXP's PX4 fork (PX4-Autopilot-NXP) as the
# `imx95` board. URLs are the official GitHub URLs; internal developers get
# the internal Bitbucket mirror transparently via bifrost.
#
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: px4
      url-base: https://github.com/nxp-mobilerobotics

  projects:
    - name: PX4-Autopilot-NXP
      remote: px4
      repo-path: PX4-Autopilot-NXP
      # Pinned to the validated NavQ95 (imx95) commit on branch
      # pr-nuttx-12-12-0-imx95.
      revision: b52aca8d9d3115356b081c64bfe91177559a7faf
      submodules: true
      path: PX4-Autopilot
