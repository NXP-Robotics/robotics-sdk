# NXP Robotic Platforms SDK - PX4 stack - mr-vmu-tropic platform
#
# Pins the exact PX4-Autopilot revision used to build the mr-vmu-tropic
# artifacts. PX4 is cloned as a standalone west project (with submodules)
# and built via its own make system, dispatched by `west sdk build` 
# (see scripts/sdk.py). 
manifest:
  version: "1.0"

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: px4
      url-base: https://github.com/nxp-robotics

  projects:
    - name: robotics-PX4-Autopilot
      remote: px4
      repo-path: robotics-PX4-Autopilot
      # Pinned to the SHA of PX4 validated for this SDK release.
      revision: d611e32698c239c2a611127563b42d335a0a4c9b
      submodules: true
      path: PX4-Autopilot
