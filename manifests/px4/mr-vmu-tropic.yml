# NXP Robotics SDK - PX4 stack - mr-tropic platform
#
# Pins the exact PX4-Autopilot revision used to build the tropic artifacts.
# PX4 is cloned as a standalone west project (with submodules) and built via
# its own make system, dispatched by `west sdk build` (see scripts/sdk.py).
# URLs are the official GitHub URLs; internal developers get the internal
# Bitbucket mirror transparently via bifrost.
manifest:
  version: "1.0"

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: px4
      url-base: https://github.com/nxp-robotics

  projects:
    - name: robotics-PX4-Autopilot
      remote: px4
      repo-path: robotics-PX4-Autopilot
      # Pinned to the SHA of PX4 validated for this SDK release.
      revision: 3e24773c4d82858d2e9cedca72407219d2c67c7a
      submodules: true
      path: PX4-Autopilot
