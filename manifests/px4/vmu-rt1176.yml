# NXP Robotics SDK - PX4 stack - vmu-rt1176 platform (CogniPilot VMU on RT1176)
#
# Pins the exact PX4-Autopilot revision used to build the vmu-rt1176 artifacts.
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: px4
      url-base: ssh://git@bitbucket.sw.nxp.com/tars

  projects:
    - name: PX4-Autopilot
      remote: px4
      repo-path: px4-autopilot-nxp.git
      # Pinned to the SHA of PX4 validated for this SDK release.
      revision: 82cb672cd75fee462691ebcf63520fb174f79c27
      submodules: true
      path: PX4-Autopilot
