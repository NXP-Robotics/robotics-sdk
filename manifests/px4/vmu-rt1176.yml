# NXP Robotics SDK - PX4 stack - vmu-rt1176 platform (CogniPilot VMU on RT1176)
#
# Pins the exact PX4-Autopilot revision used to build the vmu-rt1176 artifacts.
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: px4
      url-base: https://github.com/PX4

  projects:
    - name: PX4-Autopilot
      remote: px4
      # Pinned to the top of upstream PX4 release/1.17 validated for
      # this SDK release.
      revision: 6249cc3d892e161f5834d8976e41b5ee27443864
      submodules: true
      path: PX4-Autopilot
