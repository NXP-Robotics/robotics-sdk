# NXP Robotic Platforms SDK - PX4 stack - mr-navq95 platform (NavQ95, i.MX95 M7)
#
# NavQ95 PX4 support lives on NXP's PX4 fork (PX4-Autopilot-NXP) as the
# `imx95` board. URLs are the official GitHub URLs; internal developers get
# the internal Bitbucket mirror transparently via bifrost.
#
manifest:
  version: "1.0"

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: px4
      url-base: https://github.com/nxp-robotics

  projects:
    - name: robotics-PX4-Autopilot
      remote: px4
      repo-path: robotics-PX4-Autopilot
      # Pinned to the validated NavQ95 (imx95) commit on branch
      # pr-nuttx-12-12-0-imx95.
      revision: c3ec371c9c885146f2fe01b785ed128b4c6e2e64
      submodules: true
      path: PX4-Autopilot
