# NXP Robotics SDK - AM32 stack - mr-esc-mcxa platform
#
# AM32 is an open-source ESC / motor-controller firmware. This platform builds
# it for NXP MCXA targets (currently the FRDM-MCXA153 board -> make target
# FRDM_A153), together with the matching AM32 bootloader.
#
# NOTE: intentionally NOT pinned yet -- we track upstream directly for
# development. Pin to an exact tag/SHA at release time (replace 'revision').
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: am32-firmware
      url-base: ssh://git@bitbucket.sw.nxp.com/tars
    - name: am32-github
      url-base: https://github.com/am32-firmware

  projects:
    - name: AM32
      remote: am32-firmware
      repo-path: am32.git
      # Floating on upstream default branch (no release pin yet).
      revision: 85626b55341816661cb6d5c9402fcf39bcbeb2f6
      # AM32 pulls its MCU HAL/CMSIS via git submodules.
      submodules: true
      path: AM32

    # AM32 open-source ESC bootloader, tracked on upstream 'master' during
    # development (pin to an exact tag/SHA at release time). No submodules --
    # the A153 HAL/CMSIS is vendored in-tree.
    - name: AM32-bootloader
      remote: am32-github
      repo-path: AM32-bootloader
      revision: 8a53777b4bb57231e364bd23c893b4c156020579
      path: AM32-bootloader
