# NXP Robotic Platforms SDK - AM32 stack - mr-esc-am32-mcxa133 platform
#
# AM32 is an open-source ESC / motor-controller firmware. This platform builds
# it for NXP MCXA targets (currently the FRDM-MCXA153 board -> make target
# FRDM_A153), together with the matching AM32 bootloader.
#
# Both are internally mirrored (robotics-am32, robotics-am32-bootloader).
# The manifest uses the nxp-robotics GitHub URLs, which bifrost redirects to
# the internal Bitbucket mirrors.
#
# AM32 is pinned to the robotics_0.7.0-rc5 tag; the bootloader is pinned to
# the robotics-0.7.0 branch top of tree.
manifest:
  version: "1.0"

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: nxp-robotics
      url-base: https://github.com/nxp-robotics

  projects:
    - name: robotics-am32
      remote: nxp-robotics
      repo-path: robotics-am32
      revision: robotics_0.7.0-rc5
      # AM32 pulls its MCU HAL/CMSIS via git submodules.
      submodules: true
      path: AM32

    # AM32 ESC bootloader. No submodules -- the A153 HAL/CMSIS is vendored
    # in-tree.
    - name: robotics-am32-bootloader
      remote: nxp-robotics
      repo-path: robotics-am32-bootloader
      revision: ddea91164a6e04dd8b539b91557d886ae37169e3
      path: AM32-bootloader
