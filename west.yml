# Bootstrap manifest for the NXP Robotic Platforms SDK.
#
# Intentionally minimal: it registers the 'sdk' west extension command and
# declares NO buildable projects/imports, so 'west sdk' is available
# immediately after 'west init' WITHOUT needing 'west update' first.
#
# 'west sdk build' switches manifest.file to the chosen
# manifests/<stack>/<platform>.yml (which DO import upstream) and then runs
# 'west update'.
#
# URLs are the OFFICIAL (external) GitHub URLs. Internal developers use the
# bifrost mechanism to transparently redirect these GitHub URLs to their
# internal Bitbucket mirrors; external users resolve them directly on GitHub.
# (Internal developers bootstrap from the bifrost repo's internal manifest,
# which imports this file - see that repo for details.)
#
# Groups:
#   docs     - documentation repo. ENABLED by default (internal work). Upstream
#              releases strip it (delivered as pre-built HTML out of tree):
#                west update --group-filter -docs
#   bifrost  - reserved for the internal-only bifrost workflow. DISABLED by
#              default. No project is declared for it here: bifrost is the
#              manifest repo internal developers bootstrap from, so it is never
#              a project of this public manifest.
#   internal - reserved for future internal-only content. DISABLED by default.
#              Internal-only projects are declared in the bifrost repo's
#              internal manifest, never here, so their names never reach the
#              public (upstreamed) manifest.
manifest:
  version: "1.0"

  # bifrost + internal are opt-in (internal developers only); docs is on.
  group-filter: [-bifrost, -internal]

  self:
    path: robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: nxp-robotics
      url-base: https://github.com/nxp-robotics

  projects:
    - name: robotics-docs
      remote: nxp-robotics
      revision: robotics-0.7.0
      path: docs
      groups: [docs]

    # The MCXN-T1 ROS2-node apps (gnss, io_exp, optical_flow) live here as
    # the mcxn-t1-ros2-nodes Zephyr module. Pinned so a plain west update
    # brings them in; the cerebri stack build also imports this repo for the
    # transitive module set (zros/synapse_pb/zenoh-pico/...).
    - name: robotics-apps
      remote: nxp-robotics
      revision: bfe5cf11add1c8195789df8fdf3ed46d5eba8e9f
      path: robotics-apps
