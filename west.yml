# Bootstrap manifest for the NXP Robotics SDK.
#
# Intentionally minimal: it registers the 'sdk' west extension command and
# declares NO buildable projects/imports, so 'west sdk' is available
# immediately after 'west init' WITHOUT needing 'west update' first.
#
# 'west sdk build' switches manifest.file to the chosen
# manifests/<stack>/<platform>.yml (which DO import upstream) and then runs
# 'west update'.
#
# The only project declared here is the internal documentation repo
# (nxp-robotics-docs). It lives in the 'docs' group, which is ENABLED by
# default, so a plain 'west init -l' + 'west update' brings the docs in for
# internal work. External / upstream releases strip the docs (delivered
# pre-compiled as HTML, out of tree) by disabling the group:
#   west update --group-filter -docs
manifest:
  version: "1.0"

  self:
    path: nxp-robotics-sdk
    west-commands: scripts/west-commands.yml

  remotes:
    - name: tars
      url-base: ssh://git@bitbucket.sw.nxp.com/tars

  projects:
    - name: nxp-robotics-docs
      remote: tars
      revision: e4090cf3436a5c6e0341b8057f185e156144f7dd
      path: docs
      groups: [docs]
    # The MCXN-T1 ROS2-node apps (gnss, io_exp, optical_flow) live here as
    # the mcxn-t1-ros2-nodes Zephyr module. Pinned so a plain west update
    # brings them in; the cerebri stack build also imports this repo for the
    # transitive module set (zros/synapse_pb/zenoh-pico/...).
    - name: nxp-robotics-apps
      remote: tars
      revision: f1d13db254e988c04d67a9d9cd4b7e6d0eb77c09
      path: nxp-robotics-apps
