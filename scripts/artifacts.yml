# Single source of truth mapping each platform to the prebuilt artifacts hosted
# on Nexus. The WIC (Ubuntu A-core image) is declared ONLY for navq95_m7.
#
# NOTE: The Nexus backend is not wired yet. Coordinates below are placeholders;
# fill in real sha256 checksums (and adjust `repo`/`version`) when Nexus is
# available. See scripts/sdk.py::_download_stub for the fetch TODO.

repo: https://nexus.example.nxp.com/repository/nxp-robotics-sdk-raw   # TODO: real Nexus URL
version: 2026.07.0                                                    # TODO: bind to VERSION file

platforms:
  navq95_m7:
    - {name: navq95.elf,        dest: bin/realtime/, sha256: TODO}
    - {name: navq95.bin,        dest: bin/realtime/, sha256: TODO}
    - {name: navq95_ddr.elf,    dest: bin/realtime/, sha256: TODO}
    - {name: navq95_ddr.bin,    dest: bin/realtime/, sha256: TODO}
    - {name: navq95-ubuntu.wic, dest: ubuntu/,       sha256: TODO}   # navq95 only

  tropic:
    - {name: mr-tropic.bin,            dest: bin/realtime/, sha256: TODO}
    - {name: mr-tropic.bootloader.bin, dest: bin/realtime/, sha256: TODO}

  vmu-rt1176:
    - {name: vmu-rt1176.elf, dest: bin/realtime/, sha256: TODO}
    - {name: vmu-rt1176.bin, dest: bin/realtime/, sha256: TODO}
