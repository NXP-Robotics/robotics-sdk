# Build + artifact definition for the navq95 platform (NavQ95, i.MX95 M7).
#
# This file is the single source of truth for how each stack builds this
# platform and what artifacts it produces. `west sdk build` / `west sdk
# download` read it generically; sdk.py contains no platform-specific logic.

platform: navq95
default_stack: px4

# NavQ95 keeps a realtime/ sub-dir because it also ships an Ubuntu WIC image
# under bin/navq95/ubuntu/; the M7 firmware lives in bin/navq95/realtime/.
realtime_subdir: realtime

stacks:
  # NavQ95 PX4 support is NOT public: it lives on NXP's private PX4 fork as the
  # `imx95` board (see manifests/px4/navq95.yml for the pinned remote/SHA).
  px4:
    kind: px4
    targets:
      - nxp_imx95_default
      - nxp_imx95_ddr
    # Built outputs (relative to PX4-Autopilot/build/) collected into
    # bin/navq95/realtime/. Filenames preserved as-is (rename upstream in PX4).
    artifacts:
      - nxp_imx95_default/nxp_imx95_default.elf
      - nxp_imx95_default/nxp_imx95_default.bin
      - nxp_imx95_ddr/nxp_imx95_ddr.elf
      - nxp_imx95_ddr/nxp_imx95_ddr.bin

    # NavQ95-only post-build step: sign the collected .bin images with
    # MCUboot's imgtool (shipped inside the PX4 tree at scripts/imgtool.py).
    # Runs after artifacts land in bin/navq95/realtime/; 'in'/'out' are basenames
    # within that directory. Producing <name>.mcuboot.bin alongside the raw
    # .bin. Because this key exists only for navq95, signing is applied to
    # this platform only -- sdk.py stays generic.
    # NOTE: only the default (TCM) image is signed; the DDR image is NOT.
    sign:
      tool: scripts/imgtool.py     # relative to the PX4-Autopilot source tree
      version: "1.0.0"
      header_size: "0x800"
      slot_size: "0x700000"
      pad_header: true
      images:
        - {in: nxp_imx95_default.bin, out: nxp_imx95_default.mcuboot.bin}

    # Re-wrap the SIGNED image in PX4's own .px4 firmware container. PX4's
    # build already auto-generates nxp_imx95_default.px4 from the unsigned
    # .bin (via px_mkfw.py, during 'make nxp_imx95_default'); this repeats
    # that same packaging step against the mcuboot-signed .bin instead, since
    # that is the image actually flashed/deployed.
    package:
      tool: Tools/px_mkfw.py
      prototype: boards/nxp/imx95/firmware.prototype
      build_target: nxp_imx95_default   # source of parameters.xml/airframes.xml
      images:
        - {in: nxp_imx95_default.mcuboot.bin, out: nxp_imx95_default.mcuboot.px4}

# Prebuilt artifacts for `west sdk download`. Source and versions come from the
# root versions.yml; entries reference an artifact class (mcu/mpu) and select a
# subset. 'dest' is relative to bin/navq95/.
download:
  # M7 real-time firmware.
  - {name: nxp_imx95_default.elf,         class: mcu, subpath: navq95/realtime, dest: realtime/}
  - {name: nxp_imx95_default.bin,         class: mcu, subpath: navq95/realtime, dest: realtime/}
  - {name: nxp_imx95_default.mcuboot.bin, class: mcu, subpath: navq95/realtime, dest: realtime/}
  - {name: nxp_imx95_default.mcuboot.px4, class: mcu, subpath: navq95/realtime, dest: realtime/}
  - {name: nxp_imx95_ddr.elf,             class: mcu, subpath: navq95/realtime, dest: realtime/}
  - {name: nxp_imx95_ddr.bin,             class: mcu, subpath: navq95/realtime, dest: realtime/}

  # A-core Linux image (timestamped name -> glob); keep .wic.zst compressed
  # and fetch the matching .wic.bmap for bmaptool.
  - {name: navq95.wic.zst,  class: mpu, subpath: imx-desktop-xwayland, src: "imx-image-robotics-imx95-navq.rootfs-*.wic.zst",  dest: ubuntu/}
  - {name: navq95.wic.bmap, class: mpu, subpath: imx-desktop-xwayland, src: "imx-image-robotics-imx95-navq.rootfs-*.wic.bmap", dest: ubuntu/}
