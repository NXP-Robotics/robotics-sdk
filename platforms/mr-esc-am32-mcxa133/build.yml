# Build + artifact definition for the mr-esc-am32-mcxa133 platform.
#
# AM32 open-source ESC / motor-controller firmware built for NXP MCXA targets,
# plus the matching AM32 bootloader. This file is the single source of truth
# for how the platform builds and what artifacts it produces; sdk.py contains
# no platform-specific logic.

platform: mr-esc-am32-mcxa133
default_stack: am32

# Firmware artifacts go directly under bin/<platform>/ (no realtime subdir).
realtime_subdir: ""

stacks:
  # AM32 uses a GNU Makefile build. Each 'builds' entry is a separate source
  # tree; a board/bootloader is a make target (e.g. 'make FRDM_A153' or
  # 'make AM32_A153_BOOTLOADER_PB2'). A one-time 'make arm_sdk_install'
  # downloads the xPack arm-none-eabi-gcc toolchain into a tree (handled by
  # sdk.py). Entries are built in order; an entry may reuse another entry's
  # already-downloaded toolchain via 'toolchain_from' so the tools are fetched
  # only once.
  am32:
    kind: am32
    builds:
      # Main ESC / motor-controller firmware (am32.git). Installs the xPack
      # toolchain into AM32/tools/ via 'make arm_sdk_install'.
      - src: AM32
        targets:
          - FRDM_A153
        # AM32 emits versioned outputs into obj/
        # (AM32_<board>_<version>.{elf,bin,hex}); collected AS-IS (version kept
        # in the filename). Globs are resolved at collect time.
        artifacts:
          - "obj/AM32_FRDM_A153_*.elf"
          - "obj/AM32_FRDM_A153_*.bin"
          - "obj/AM32_FRDM_A153_*.hex"
      # AM32 bootloader (github.com/am32-firmware/AM32-bootloader). Same xPack
      # toolchain version/layout as the firmware, so REUSE the firmware's
      # already-downloaded tools instead of downloading again -- sdk.py builds
      # this tree with an absolute ARM_SDK_PREFIX pointing into AM32/tools/.
      # Target AM32_A153_BOOTLOADER_PB2 -> obj/AM32_A153_BOOTLOADER_PB2_V<ver>.{elf,bin,hex}.
      - src: AM32-bootloader
        toolchain_from: AM32
        dest: bootloader
        targets:
          - AM32_A153_BOOTLOADER_PB2
        artifacts:
          - "obj/AM32_A153_BOOTLOADER_PB2_*.elf"
          - "obj/AM32_A153_BOOTLOADER_PB2_*.bin"
          - "obj/AM32_A153_BOOTLOADER_PB2_*.hex"

# Prebuilt artifacts for `west sdk download`. Files are fetched directly by
# fixed name (no listing). 'dest' relative to bin/mr-esc-am32-mcxa133/
# ("" == the platform root).
download:
  - {name: AM32_FRDM_A153_2.20.elf, class: mcu, subpath: mr-esc-am32-mcxa133, dest: ""}
  - {name: AM32_FRDM_A153_2.20.bin, class: mcu, subpath: mr-esc-am32-mcxa133, dest: ""}
  - {name: AM32_FRDM_A153_2.20.hex, class: mcu, subpath: mr-esc-am32-mcxa133, dest: ""}
  - {name: AM32_A153_BOOTLOADER_PB2_V18.elf, class: mcu, subpath: mr-esc-am32-mcxa133/bootloader, dest: bootloader/}
  - {name: AM32_A153_BOOTLOADER_PB2_V18.bin, class: mcu, subpath: mr-esc-am32-mcxa133/bootloader, dest: bootloader/}
  - {name: AM32_A153_BOOTLOADER_PB2_V18.hex, class: mcu, subpath: mr-esc-am32-mcxa133/bootloader, dest: bootloader/}

  # esc_passthrough (built on the mr-vmu-rt1176 platform, collected here under
  # passthrough/<platform>/ via that stack's collect_dir + image_name).
  # Non-sysbuild Zephyr build -> renamed .bin + .elf per board.
  - {name: esc_mr_vmu_rt1176_passthrough.bin, class: mcu, subpath: mr-esc-am32-mcxa133/passthrough/mr-vmu-rt1176, dest: passthrough/mr-vmu-rt1176/}
  - {name: esc_mr_vmu_rt1176_passthrough.elf, class: mcu, subpath: mr-esc-am32-mcxa133/passthrough/mr-vmu-rt1176, dest: passthrough/mr-vmu-rt1176/}
  - {name: LICENSE,        class: mcu, subpath: mr-esc-am32-mcxa133, dest: ""}
  - {name: SBOM.spdx.json, class: mcu, subpath: mr-esc-am32-mcxa133, dest: ""}
  - {name: Apache-2.0.txt,   class: mcu, subpath: mr-esc-am32-mcxa133/Licenses, dest: Licenses/}
  - {name: BSD-3-Clause.txt, class: mcu, subpath: mr-esc-am32-mcxa133/Licenses, dest: Licenses/}
  - {name: LICENSE,        class: mcu, subpath: mr-esc-am32-mcxa133/bootloader, dest: bootloader/}
  - {name: SBOM.spdx.json, class: mcu, subpath: mr-esc-am32-mcxa133/bootloader, dest: bootloader/}
  - {name: Apache-2.0.txt,   class: mcu, subpath: mr-esc-am32-mcxa133/bootloader/Licenses, dest: bootloader/Licenses/}
  - {name: BSD-3-Clause.txt, class: mcu, subpath: mr-esc-am32-mcxa133/bootloader/Licenses, dest: bootloader/Licenses/}
  # robotics-apps LICENSE + SBOM for the RT1176 passthrough image.
  - {name: LICENSE,        class: mcu, subpath: mr-esc-am32-mcxa133/passthrough/mr-vmu-rt1176, dest: passthrough/mr-vmu-rt1176/}
  - {name: SBOM.spdx.json, class: mcu, subpath: mr-esc-am32-mcxa133/passthrough/mr-vmu-rt1176, dest: passthrough/mr-vmu-rt1176/}
  - {name: Apache-2.0.txt, class: mcu, subpath: mr-esc-am32-mcxa133/passthrough/mr-vmu-rt1176/LICENSES, dest: passthrough/mr-vmu-rt1176/LICENSES/}
  - {name: CC-BY-4.0.txt,  class: mcu, subpath: mr-esc-am32-mcxa133/passthrough/mr-vmu-rt1176/LICENSES, dest: passthrough/mr-vmu-rt1176/LICENSES/}
