# Build + example definition for the mr-mcxn-t1 platform (NXP MCXN947 MR-MCXN-T1).
#
# Two ways of working:
#   * zephyr  - reuse/build stock Zephyr samples for board/peripheral validation.
#               User-facing --shield {t1,oflo,f9p} selects the example set.
#               Shields are MUTUALLY EXCLUSIVE (a shield occupies the expansion
#               connector, so the I/O breakout peripherals are reachable ONLY on t1).
#   * cerebri - build CogniPilot integration apps (optical_flow now). The user
#               does NOT pass --shield; the SDK maps each app to its shield and
#               injects that shield's overlay (M2: the SDK is authoritative).
#
#   west sdk build --platform mr-mcxn-t1 [--shield t1|oflo|f9p] [<example>]      # zephyr
#   west sdk build --platform mr-mcxn-t1 --stack cerebri [<app>]                # cerebri
#
# Example names are inherited from the upstream Zephyr sample (the sample's
# directory leaf), disambiguated by peripheral/location where the same sample
# serves multiple physical devices (e.g. the ICM-45686 exists on BOTH the hub
# (U9, LPSPI8) and the OFLO shield (U3, LPSPI7) -- verified from schematic + DTS).
#
# Examples are built by default: an entry needs no flag to be part of the set
# built when NO <example> is given. Two opt-outs exist:
#
# default: false    -> works, but is not built by default (and not published).
#   Still built by --build-all and by explicitly naming it.
# expect_fail: true -> known broken (e.g. the board/shield lacks a devicetree
#   node the sample requires). Never built automatically, by either the default
#   set or --build-all; still buildable by name, where it is expected to fail.

platform: mr-mcxn-t1
default_stack: zephyr
default_shield: t1

realtime_subdir: ""

# Zephyr binary blobs required by this platform. west update does NOT pull
# these; the SDK fetches them (west blobs fetch) before zephyr/cerebri builds.
# The AFBR ToF nodes are inlined in the base DTS, so every build links it.
blobs:
  - hal_afbr

# MCUboot via sysbuild is enabled per stack below (zephyr/cerebri kind only).
overlays:
  t1:   null
  oflo: null
  f9p:  null

stacks:
  zephyr:
    kind: zephyr
    # MCUboot via sysbuild: every example builds BOTH the MCUboot bootloader
    # (mcuboot/zephyr/zephyr.bin) and the runnable signed app
    # (<app>/zephyr/zephyr.signed.bin). sysbuild is a zephyr/cerebri-kind
    # capability (PX4/AM32 cannot use it); enabled here per stack.
    sysbuild: true
    sysbuild_args:
      - -DSB_CONFIG_BOOTLOADER_MCUBOOT=y
    boards:
      - mr_mcxn_t1/mcxn947/cpu0
    shields:
      t1:
        examples:
          - {name: hello_world,               app: zephyr/samples/hello_world}
          - {name: dhcpv4_client,             app: zephyr/samples/net/dhcpv4_client}
          - {name: accel_polling,             app: zephyr/samples/sensor/accel_polling}
          - {name: pwm_shell,                 app: zephyr/samples/subsys/shell/shell_module}
          - {name: can_counter,               app: zephyr/samples/drivers/can/counter}
          - {name: led_strip,                 app: zephyr/samples/drivers/led/led_strip}
          - {name: cdc_acm,                   app: zephyr/samples/subsys/usb/cdc_acm}
          - {name: uart_pass,                 app: zephyr/samples/drivers/uart/passthrough}
          - {name: qdec,                      app: zephyr/samples/sensor/qdec}
          - {name: watchdog,                  app: zephyr/samples/drivers/watchdog}
          - {name: rtc,                       app: zephyr/samples/drivers/rtc}
          - {name: zms,                       app: zephyr/samples/subsys/kvss/zms}
      oflo:
        shield_name: mr_mcxn_t1_optical_flow
        examples:
          - {name: 6dof_motion_drdy,           app: zephyr/samples/sensor/6dof_motion_drdy}
          - {name: sensor_shell,               app: zephyr/samples/sensor/sensor_shell}
      f9p:
        shield_name: mr_mcxn_t1_f9p
        examples:
          - {name: gnss, app: zephyr/samples/drivers/gnss}

  cerebri:
    kind: cerebri
    sysbuild: true
    sysbuild_args:
      - -DSB_CONFIG_BOOTLOADER_MCUBOOT=y
      - -Dmcuboot_EXTRA_CONF_FILE=zephyr/boards/nxp/mr_mcxn_t1/mcuboot/mr_mcxn_t1_mcxn947_cpu0.conf
      - -Dmcuboot_DTC_OVERLAY_FILE=zephyr/boards/nxp/mr_mcxn_t1/mcuboot/mr_mcxn_t1_mcxn947_cpu0.overlay
    boards:
      - mr_mcxn_t1/mcxn947/cpu0
    apps:
      - {name: optical_flow, app: robotics-apps/mcxn-t1-ros2-nodes/app/optical_flow, shield: oflo}
      - {name: gnss,         app: robotics-apps/mcxn-t1-ros2-nodes/app/gnss,         shield: f9p}
      - {name: io_exp,       app: robotics-apps/mcxn-t1-ros2-nodes/app/io_exp,       shield: io_exp}

# Prebuilt artifacts for `west sdk download`. Source and versions come from the
# root versions.yml; entries reference the mcu class (Robotics_Firmware) and
# select a subset -- the curated CI/default example set (the only examples the
# build publishes). Each sysbuild example ships the runnable signed app plus its
# MCUboot bootloader; 'dest' is relative to bin/mr-mcxn-t1/ and preserves the
# build output layout <stack>/<shield>/<example>/ so same-named files (each is
# named zephyr.signed.bin / mcuboot.bin) do not collide.
download:
  # zephyr / t1
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/hello_world,        dest: zephyr/t1/hello_world/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/hello_world,        dest: zephyr/t1/hello_world/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/dhcpv4_client,      dest: zephyr/t1/dhcpv4_client/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/dhcpv4_client,      dest: zephyr/t1/dhcpv4_client/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/accel_polling,      dest: zephyr/t1/accel_polling/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/accel_polling,      dest: zephyr/t1/accel_polling/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/pwm_shell,          dest: zephyr/t1/pwm_shell/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/pwm_shell,          dest: zephyr/t1/pwm_shell/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/can_counter,        dest: zephyr/t1/can_counter/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/can_counter,        dest: zephyr/t1/can_counter/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/led_strip,          dest: zephyr/t1/led_strip/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/led_strip,          dest: zephyr/t1/led_strip/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/cdc_acm,            dest: zephyr/t1/cdc_acm/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/cdc_acm,            dest: zephyr/t1/cdc_acm/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/uart_pass,          dest: zephyr/t1/uart_pass/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/uart_pass,          dest: zephyr/t1/uart_pass/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/qdec,               dest: zephyr/t1/qdec/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/qdec,               dest: zephyr/t1/qdec/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/watchdog,           dest: zephyr/t1/watchdog/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/watchdog,           dest: zephyr/t1/watchdog/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/rtc,                dest: zephyr/t1/rtc/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/rtc,                dest: zephyr/t1/rtc/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/t1/zms,                dest: zephyr/t1/zms/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/t1/zms,                dest: zephyr/t1/zms/}
  # zephyr / oflo
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/oflo/6dof_motion_drdy, dest: zephyr/oflo/6dof_motion_drdy/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/oflo/6dof_motion_drdy, dest: zephyr/oflo/6dof_motion_drdy/}
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/oflo/sensor_shell,     dest: zephyr/oflo/sensor_shell/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/oflo/sensor_shell,     dest: zephyr/oflo/sensor_shell/}
  # zephyr / f9p
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/zephyr/f9p/gnss,              dest: zephyr/f9p/gnss/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/zephyr/f9p/gnss,              dest: zephyr/f9p/gnss/}
  # cerebri / oflo
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/cerebri/oflo/optical_flow,    dest: cerebri/oflo/optical_flow/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/cerebri/oflo/optical_flow,    dest: cerebri/oflo/optical_flow/}
  # cerebri / f9p
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/cerebri/f9p/gnss,             dest: cerebri/f9p/gnss/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/cerebri/f9p/gnss,             dest: cerebri/f9p/gnss/}
  # cerebri / io_exp
  - {name: zephyr.signed.bin, class: mcu, subpath: mr-mcxn-t1/cerebri/io_exp/io_exp,        dest: cerebri/io_exp/io_exp/}
  - {name: mcuboot.bin,       class: mcu, subpath: mr-mcxn-t1/cerebri/io_exp/io_exp,        dest: cerebri/io_exp/io_exp/}
  # robotics-apps (cerebri) LICENSE + SBOM for the CogniPilot images.
  - {name: LICENSE,        class: mcu, subpath: mr-mcxn-t1/cerebri, dest: cerebri/}
  - {name: SBOM.spdx.json, class: mcu, subpath: mr-mcxn-t1/cerebri, dest: cerebri/}
  - {name: Apache-2.0.txt, class: mcu, subpath: mr-mcxn-t1/cerebri/LICENSES, dest: cerebri/LICENSES/}
  - {name: CC-BY-4.0.txt,  class: mcu, subpath: mr-mcxn-t1/cerebri/LICENSES, dest: cerebri/LICENSES/}
  # Zephyr LICENSE + SBOM for the MCXN-T1 Zephyr samples.
  - {name: LICENSE,        class: mcu, subpath: mr-mcxn-t1/zephyr, dest: zephyr/}
  - {name: SBOM.spdx.json, class: mcu, subpath: mr-mcxn-t1/zephyr, dest: zephyr/}
  - {name: Apache-2.0.txt, class: mcu, subpath: mr-mcxn-t1/zephyr/LICENSES, dest: zephyr/LICENSES/}
  - {name: CC-BY-4.0.txt,  class: mcu, subpath: mr-mcxn-t1/zephyr/LICENSES, dest: zephyr/LICENSES/}
