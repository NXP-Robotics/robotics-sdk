# Build + artifact definition for the vmu-rt1176 platform (CogniPilot VMU, RT1176).

platform: vmu-rt1176
default_stack: px4

# Firmware artifacts go directly under bin/<platform>/ (no realtime subdir).
realtime_subdir: ""

stacks:
  px4:
    kind: px4
    # NXP MR-VMU-RT1176 is upstream PX4's FMUv6X-RT reference design board
    # (px4_fmu-v6xrt). See
    # https://docs.px4.io/main/en/flight_controller/nxp_mr_vmu_rt1176.
    # App first, bootloader next.
    targets:
      - px4_fmu-v6xrt_default
      - px4_fmu-v6xrt_bootloader
    artifacts:
      - px4_fmu-v6xrt_default/px4_fmu-v6xrt_default.elf
      - px4_fmu-v6xrt_default/px4_fmu-v6xrt_default.bin
      - px4_fmu-v6xrt_bootloader/px4_fmu-v6xrt_bootloader.elf
      - px4_fmu-v6xrt_bootloader/px4_fmu-v6xrt_bootloader.bin

  zephyr:
    kind: zephyr
    boards:
      - vmu_rt1176
    app: null

download:
  # 'dest' relative to bin/vmu-rt1176/ ("" == the platform root).
  - {name: px4_fmu-v6xrt_default.elf,    class: mcu, subpath: vmu-rt1176, dest: ""}
  - {name: px4_fmu-v6xrt_default.bin,    class: mcu, subpath: vmu-rt1176, dest: ""}
  - {name: px4_fmu-v6xrt_bootloader.elf, class: mcu, subpath: vmu-rt1176, dest: ""}
  - {name: px4_fmu-v6xrt_bootloader.bin, class: mcu, subpath: vmu-rt1176, dest: ""}
